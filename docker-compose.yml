services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astronaut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepspacepassword}
      POSTGRES_DB: ${POSTGRES_DB:-medical_inventory}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASTROTWIN_MODE: ${ASTROTWIN_MODE:-demo}
      ASTROTWIN_OPERATOR_KEY: ${ASTROTWIN_OPERATOR_KEY:-}
      ASTROTWIN_TELEMETRY_KEY: ${ASTROTWIN_TELEMETRY_KEY:-}
      ASTROTWIN_VIEWER_KEY: ${ASTROTWIN_VIEWER_KEY:-}
      ASTROTWIN_NASA_API_KEY: ${ASTROTWIN_NASA_API_KEY:-}
      ASTROTWIN_SEED_INVENTORY: ${ASTROTWIN_SEED_INVENTORY:-}
      ASTROTWIN_DEMO_TELEMETRY: ${ASTROTWIN_DEMO_TELEMETRY:-true}
      ASTROTWIN_CORS_ORIGINS: ${ASTROTWIN_CORS_ORIGINS:-}
      ASTROTWIN_TELEMETRY_STALE_SECONDS: ${ASTROTWIN_TELEMETRY_STALE_SECONDS:-30}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-medical_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-astronaut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepspacepassword}
      DATABASE_URL: ${DATABASE_URL:-}
      WEB_CONCURRENCY: ${ASTROTWIN_WORKERS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 5
    ports:
      - "127.0.0.1:${ASTROTWIN_API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app
      - data

  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ASTROTWIN_HTTP_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app

volumes:
  pgdata:

networks:
  app:
  data:
    internal: true
